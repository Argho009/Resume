<canvas id="shader-canvas-ANIMATION_20" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_20');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

varying vec2 v_texCoord;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}

float lightning(vec2 uv, float t) {
    float n = noise(uv * 3.0 + vec2(t * 0.5, t * 0.2));
    float bolt = smoothstep(0.02, 0.0, abs(uv.x - 0.5 + (n - 0.5) * 0.4));
    float flicker = step(0.98, hash(vec2(t * 5.0, 0.0)));
    return bolt * flicker;
}

void main() {
    vec2 uv = v_texCoord;
    vec2 mouse = u_mouse / u_resolution;
    
    // Background: Dark Void #05060a
    vec3 bgColor = vec3(0.0196, 0.0235, 0.0392);
    
    // Ambient Glows
    float distToMouse = distance(uv, mouse);
    vec3 cyan = vec3(0.023, 0.714, 0.831);
    vec3 ambientCyan = cyan * (0.1 / (distToMouse + 0.5));
    
    vec3 finalColor = bgColor + ambientCyan * 0.2;
    
    // Multiple Lightning Bolts
    finalColor += cyan * lightning(uv + vec2(0.2, 0.0), u_time) * 0.8;
    finalColor += cyan * lightning(uv - vec2(0.3, 0.0), u_time * 1.1) * 0.6;
    
    // Dense Rising Particles
    float particleNoise = hash(uv + floor(u_time * 15.0) * 0.05);
    if (particleNoise > 0.992) {
        float pX = hash(vec2(floor(u_time * 15.0), 1.0));
        float pY = fract(u_time * 0.4 + hash(vec2(pX, 2.0)));
        float pDist = distance(uv, vec2(pX, pY));
        finalColor += vec3(0.8, 1.0, 1.0) * smoothstep(0.005, 0.0, pDist);
    }

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div id="threejs-container-ANIMATION_19" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_N'); // Placeholder ID
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const parallaxGroup = new THREE.Group();
  scene.add(parallaxGroup);

  // 3D Hexagons
  const hexGeometry = new THREE.RingGeometry(0.8, 1.0, 6);
  const hexMaterial = new THREE.MeshPhongMaterial({
    color: 0x06b6d4,
    transparent: true,
    opacity: 0.4,
    side: THREE.DoubleSide
  });

  const hexagons = [];
  for (let i = 0; i < 20; i++) {
    const hex = new THREE.Mesh(hexGeometry, hexMaterial);
    hex.position.set(
      (Math.random() - 0.5) * 30,
      (Math.random() - 0.5) * 20,
      (Math.random() - 0.5) * 15
    );
    hex.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    hex.userData.speed = 0.005 + Math.random() * 0.01;
    hex.userData.floatSpeed = 0.5 + Math.random();
    parallaxGroup.add(hex);
    hexagons.push(hex);
  }

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0x06b6d4, 2, 50);
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);

  camera.position.z = 15;

  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX - window.innerWidth / 2) / 200;
    mouseY = (e.clientY - window.innerHeight / 2) / 200;
  });

  function animate() {
    requestAnimationFrame(animate);
    const time = Date.now() * 0.001;

    parallaxGroup.position.x += (mouseX - parallaxGroup.position.x) * 0.05;
    parallaxGroup.position.y += (-mouseY - parallaxGroup.position.y) * 0.05;

    hexagons.forEach((hex, i) => {
      hex.rotation.z += hex.userData.speed;
      hex.rotation.x += hex.userData.speed * 0.5;
      hex.position.y += Math.sin(time * hex.userData.floatSpeed + i) * 0.01;
      
      // Subtle pulse
      const pulse = 1.0 + Math.sin(time * 2.0 + i) * 0.1;
      hex.scale.set(pulse, pulse, pulse);
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
  });

  animate();
})();
})();
</script>

            span.style.animationDelay = `${0.5 + (index * 0.1)}s`;
            skillContainer.appendChild(span);
        });

        // HUD Center Text Typewriter
        const hudText = "ARGHOODEEP.AC AIML 2026 SSIPMT RAIPUR";
        const hudElement = document.getElementById('hud-center-text');
        let charIndex = 0;

        function typeHUD() {
            if (charIndex < hudText.length) {
                hudElement.textContent += hudText.charAt(charIndex);
                charIndex++;
                setTimeout(typeHUD, 50);
            }
        }
        setTimeout(typeHUD, 1000);

        // Discharge Burst Effect
        const dischargeContainer = document.getElementById('discharge-container');
        function createDischarge() {
            const line = document.createElement('div');
            line.className = 'discharge-line';
            const rotation = Math.random() * 360;
            line.style.setProperty('--rot', `${rotation}deg`);
            line.style.left = '50%';
            line.style.top = '50%';
            dischargeContainer.appendChild(line);
            
            setTimeout(() => {
                line.remove();
            }, 300);
        }

        setInterval(() => {
            if (Math.random() > 0.6) createDischarge();
        }, 150);

        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                btn.style.setProperty('--mouse-x', `${x}px`);
                btn.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
</body></html>
